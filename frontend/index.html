<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <!-- CSS layer order must be declared before MUI/emotion injects styles, otherwise Tailwind's reset overrides MUI -->
    <style>@layer theme, base, mui, components, utilities;</style>
    <link rel="icon" type="image/png" href="/zusia-icon.png" />
    <link rel="apple-touch-icon" href="/zusia-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZUSia</title>
    <script>
      // Apply saved accessibility settings before first paint (see src/accessibility/settings.ts)
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('zus.a11y') || '{}');
          var r = document.documentElement;
          var dark = s.themeMode === 'dark' || (s.themeMode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          r.setAttribute('data-theme', dark ? 'dark' : 'light');
          r.setAttribute('data-font-size', s.fontSize || 'normal');
          if (s.highContrast) r.setAttribute('data-contrast', 'high');
          if (s.textSpacing) r.setAttribute('data-text-spacing', 'true');
          if (s.underlineLinks) r.setAttribute('data-underline-links', 'true');
          if (s.reduceMotion) r.setAttribute('data-reduce-motion', 'true');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
